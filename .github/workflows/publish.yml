# Publishes the VS Code extension to the Visual Studio Marketplace.
# Started by hand from the Actions tab, on main only. It authenticates with
# Trusted Publishing (OIDC): the Marketplace policy of the publisher names
# this repository and this file, so no token is stored in the repository.
# Renaming this file breaks the policy.
#
# Before running it, raise "version" in vscode-cobalto/package.json: the
# Marketplace rejects a version that is already published.
name: Publish VS Code extension

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  extension:
    name: Visual Studio Marketplace
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vscode-cobalto
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-cobalto/package-lock.json
      - run: npm ci
      - run: npm test
      # --oidc needs vsce 4; the project still packages with vsce 3.
      # Publishing runs lint and compile again (vscode:prepublish).
      - name: Publish
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --no-dependencies
