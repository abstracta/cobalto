[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalto"
dynamic = ["version"]
description = "Portable unit testing for COBOL"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abstracta" }]
keywords = ["cobol", "unit-testing", "testing", "legacy", "gnucobol", "openvms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Unit",
]

[project.urls]
Homepage = "https://github.com/abstracta/cobalto"
Documentation = "https://github.com/abstracta/cobalto/blob/main/docs/reference.md"
Issues = "https://github.com/abstracta/cobalto/issues"
Changelog = "https://github.com/abstracta/cobalto/blob/main/CHANGELOG.md"

# One program, two names: cobalto, and cblt for short.
[project.scripts]
cobalto = "cobalto.cli:main"
cblt = "cobalto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The COBOL core and the built-in profiles travel inside the package.
[tool.setuptools.package-data]
cobalto = ["lib/*", "profiles/*"]

[tool.setuptools.dynamic]
version = { attr = "cobalto.__version__" }
